<!DOCTYPE html>
<!-- Verzio: v2.0.0 - 2026-10-19 -->
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-mail megerősítés - cYc</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/assets/js/theme-init.js"></script>
    <script src="/assets/js/common.js" defer></script>
    <script src="/assets/js/auth-pages.js" defer></script>
</head>
<body data-page="verify">
    <header id="siteHeader" class="header"></header>

    <main class="main-content center">
        <div class="container">

            <section class="card card-narrow">
                <h1 class="page-title">E-mail megerősítés</h1>
                <div class="alert" id="formAlert" role="alert"></div>
                <div id="resendBlock" hidden>
                    <form class="form" id="resendForm" novalidate>
                        <p>Nem kaptad meg, vagy lejárt a link? Kérj újat:</p>
                        <div class="field">
                            <label for="email">E-mail cím</label>
                            <input class="input" type="email" id="email" autocomplete="email" required>
                        </div>
                        <div class="captcha-box" id="captchaBox"></div>
                        <button class="btn btn-block" type="submit">Új megerősítő levél</button>
                    </form>
                    <div class="form-footer"><p><a href="/login.html">Vissza a bejelentkezéshez</a></p></div>
                </div>
            </section>
        </div>
    </main>

    <footer id="siteFooter" class="footer"></footer>
</body>
</html>
