<!DOCTYPE html>
<!-- Verzio: v2.0.0 - 2026-10-19 -->
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>404 - Az oldal nem található</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <script src="/assets/js/theme-init.js"></script>
    <style>
        /* Minden útvonal abszolút, mert a szerver bármilyen mélységű címre ezt az oldalt adja */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #c9b7a2; }
        :root[data-theme="dark"] body { background-color: #2a2420; }
        .background-image { position: absolute; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        /* Sötét módban a világos kép nem világít: fényerő csökkentve (fotó, ezért nem invertáljuk) */
        :root[data-theme="dark"] .background-image { filter: brightness(0.5) saturate(0.9); }
        .content-overlay { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center; text-align: center; box-sizing: border-box; padding: 40px 20px; }
        .error-text { font-size: 1.6rem; font-weight: 600; color: #fff; line-height: 1.6; background-color: rgba(0, 0, 0, 0.6);
            padding: 20px 30px; border-radius: 10px; max-width: 90%; margin: 0; }
        .home-icon { position: absolute; top: 25px; right: 25px; width: 50px; height: 50px; z-index: 3; transition: transform 0.2s ease-in-out; }
        .home-icon:hover { transform: scale(1.15); }
        .home-icon svg { width: 100%; height: 100%; fill: #fff; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7)); }
        @media (max-width: 768px) {
            .error-text { font-size: 1.2rem; padding: 15px 20px; }
            .home-icon { width: 40px; height: 40px; top: 15px; right: 15px; }
        }
    </style>
</head>
<body>
    <picture>
        <source srcset="/assets/img/404.webp" type="image/webp">
        <img src="/assets/img/404.jpg" alt="" class="background-image">
    </picture>

    <a href="/" class="home-icon" aria-label="Főoldal">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"/>
        </svg>
    </a>

    <div class="content-overlay">
        <p class="error-text">
            Nincs probLÁMA! Ilyen oldal nem létezik, de nyugodtan fáradj a főoldalra a házikóra kattintva!
        </p>
    </div>
</body>
</html>
