<!DOCTYPE html>
<!-- Verzio: v2.0.0 - 2026-10-19 -->
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elfelejtett jelszó - cYc</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/assets/js/theme-init.js"></script>
    <script src="/assets/js/common.js" defer></script>
    <script src="/assets/js/auth-pages.js" defer></script>
</head>
<body data-page="forgot">
    <header id="siteHeader" class="header"></header>

    <main class="main-content center">
        <div class="container">

            <section class="card card-narrow">
                <h1 class="page-title">Elfelejtett jelszó</h1>
                <div class="alert" id="formAlert" role="alert"></div>
                <form class="form" id="forgotForm" novalidate>
                    <p>Add meg a fiókodhoz tartozó e-mail címet, és küldünk egy linket az új jelszó beállításához.</p>
                    <div class="field">
                        <label for="email">E-mail cím</label>
                        <input class="input" type="email" id="email" autocomplete="email" required>
                    </div>
                    <div class="captcha-box" id="captchaBox"></div>
                    <button class="btn btn-block" type="submit">Link küldése</button>
                </form>
                <div class="form-footer"><p><a href="/login.html">Vissza a bejelentkezéshez</a></p></div>
            </section>
        </div>
    </main>

    <footer id="siteFooter" class="footer"></footer>
</body>
</html>
