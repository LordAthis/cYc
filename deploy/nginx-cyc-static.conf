# Verzio: v0.4.1 - 2026-10-19
# nginx – "STATIKUS MÓD" (Node nélkül): a kalkulátor és a tájékoztató oldalak működnek, fiók nincs.
# Ez az átmeneti, legkisebb kockázatú lépés: a gyökér a public/ mappa lesz, a repó többi része nem látszik.
# MINTA! A meglévő beállítást ne írd felül vakon: előbb a deploy/diagnose.sh kimenete alapján egyeztessük.
# A rejtett útvonalon futó MÁSIK weboldal blokkját a MEGLÉVŐ konfigurációból kell átmásolni, változtatás nélkül.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/cyc/public;               # <- a cYc klón public mappája
    index index.html;

    # --- A MÁSIK WEBOLDAL: a meglévő location blokkját IDE másold (helyben, a szerveren) ---
    # location ^~ /<rejtett-utvonal>/ { ... }

    location = /public/ { return 301 /; }
    location ^~ /public/ { rewrite ^/public/(.*)$ /$1 permanent; }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
