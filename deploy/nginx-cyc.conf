# Nginx forditott proxy a cYc ele. A domain-t ird at, majd:
#   sudo cp deploy/nginx-cyc.conf /etc/nginx/sites-available/cyc
#   sudo ln -s /etc/nginx/sites-available/cyc /etc/nginx/sites-enabled/cyc
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cyc.example.hu      (ingyenes HTTPS tanusitvany, Let's Encrypt)

server {
    listen 80;
    listen [::]:80;
    server_name cyc.example.hu;

    client_max_body_size 64k;

    # Statikus fajlok kozvetlenul nginx-bol (gyorsabb); minden mas a Node szerverhez megy
    location /assets/ {
        root /opt/cyc/public;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
