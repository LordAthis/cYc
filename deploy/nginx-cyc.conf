# Verzio: v0.4.1 - 2026-10-19
# nginx – "NODE MÓD" (teljes funkció: belépés, fiók, admin). Csak akkor kapcsold be, ha a cyc szolgáltatás fut.
# MINTA! A meglévő beállítást ne írd felül vakon: előbb a deploy/diagnose.sh kimenete alapján egyeztessük.
# A már működő, rejtett útvonalon futó MÁSIK weboldal blokkját a MEGLÉVŐ konfigurációból kell átmásolni,
# változtatás nélkül, a "location /" ELÉ – annak nevét/útvonalát ebbe a repóba SOHA ne írd be.
#
# Telepítés:  sudo cp deploy/nginx-cyc.conf /etc/nginx/sites-available/cyc   (az útvonalakat igazítsd)
#             sudo nginx -t && sudo systemctl reload nginx
# Visszaállás: a korábbi konfiguráció visszamásolása, majd sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                      # IP-címes elérés (domain nélkül)

    client_max_body_size 64k;

    # --- A MÁSIK WEBOLDAL: a meglévő location blokkját IDE másold (helyben, a szerveren) ---
    # location ^~ /<rejtett-utvonal>/ { ... }

    # A régi v0.3 címek (gyökérből kiszolgált fájlok) közvetlenül a megfelelő oldalra
    location = /public/ { return 301 /; }
    location ^~ /public/ { rewrite ^/public/(.*)$ /$1 permanent; }

    # A repó belső mappái kívülről soha
    location ~ ^/(server|deploy|tools|node_modules|\.git)(/|$) { return 404; }

    # Statikus fájlok közvetlenül nginx-ből (gyorsabb)
    location /assets/ {
        root /opt/cyc/public;           # <- a cYc klón public mappája
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Minden más a Node szerverhez
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Később, ha lesz domain + HTTPS:  sudo certbot --nginx -d <domain>
# és a server/.env-ben APP_ORIGIN=https://<domain>
