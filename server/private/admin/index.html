<!DOCTYPE html>
<!-- Verzio: v2.0.0 - 2026-10-19 -->
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - cYc</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/assets/js/theme-init.js"></script>
    <script src="/assets/js/common.js" defer></script>
    <script src="./admin.js" defer></script>
</head>
<body data-page="admin">
    <header id="siteHeader" class="header"></header>

    <main class="main-content">
        <div class="container">

            <div class="card-wide">
                <section class="card">
                    <h1 class="section-title">Admin – felhasználók
                        <input class="input" id="search" placeholder="Keresés e-mail vagy név alapján" style="max-width:320px">
                    </h1>
                    <p class="hint">A „Rejtett” oszlop kapcsolója adja meg egyenként, ki látja a belső felületet. Adminok mindig látják.</p>
                    <div class="table-wrap" style="margin-top:1rem">
                        <table class="table">
                            <thead><tr><th>E-mail</th><th>Szerep</th><th>Rejtett</th><th>2FA</th><th>Állapot</th><th>Utolsó belépés</th><th class="num">Műveletek</th></tr></thead>
                            <tbody id="usersBody"></tbody>
                        </table>
                    </div>
                </section>
                <section class="card">
                    <h2 class="section-title">Biztonsági napló (utolsó 200)</h2>
                    <div class="table-wrap">
                        <table class="table"><thead><tr><th>Idő</th><th>Esemény</th><th>Felhasználó</th><th>IP</th><th>Részlet</th></tr></thead><tbody id="auditBody"></tbody></table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer id="siteFooter" class="footer"></footer>
</body>
</html>
